[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "higgs-event-lab"
version = "0.1.0.dev0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.49", "matplotlib>=3.8", "joblib>=1.3"]
training = ["torch>=2.2", "xgboost>=2.0"]
dev = ["higgs-event-lab[dashboard,training]", "pytest>=8.0", "nbformat>=5.9"]
notebooks = ["jupyterlab>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
